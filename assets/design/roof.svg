troke="#244b3b" stroke-width="2.6" stroke-linecap="round"/><line x1="230.78" y1="252.85" x2="230.78" y2="571.07" stroke="#244b3b" stroke-width="2.6" stroke-linecap="round"/><rect x="387.70" y="291.92" width="15.77" height="32.97" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><rect x="370.20" y="146.44" width="15.77" height="32.97" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><rect x="91.17" y="274.12" width="17.20" height="21.50" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><rect x="234.37" y="359.75" width="17.20" height="25.80" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><rect x="234.37" y="450.05" width="17.20" height="24.08" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><text x="242.2" y="164.4" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1f3a2f">MAIN HOUSE</text><text x="242.2" y="203.9" text-anchor="middle" font-family="Arial" font-size="10" font-weight="400" fill="#1f3a2f">ridge 14′7″</text><text x="100.2" y="384.0" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1f3a2f">BEDROOM 4</text><text x="100.2" y="503.0" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1f3a2f">BEDROOM 3</text><text x="378.6" y="449.4" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1f3a2f">GARAGE</text><text x="378.6" y="466.6" text-anchor="middle" font-family="Arial" font-size="10" font-weight="400" fill="#1f3a2f">ridge 12′4½″</text><text x="230.8" y="591.7" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#1f3a2f">ENTRY + PORCH</text><text x="242.2" y="615.8" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#586a60">FRONT / STREET</text><text x="570" y="104" font-family="Arial" font-size="26" font-weight="400" fill="#244b3b">The roof of the architect's sheets.</text><text x="570" y="140" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Every plane is 5 in 12 with 1′0″ eaves and a charcoal fascia.</text><text x="570" y="166" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Main ridge 14′7″ and garage ridge 12′4½″ above the floor.</text><rect x="570" y="204" width="16" height="16" fill="#9bb0a0"/><text x="598" y="218" font-family="Arial" font-size="18" font-weight="400" fill="#244b3b">Gable roof over Bedrooms 3 and 4</text><text x="598" y="246" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Its west plane is the main roof's west plane, carried to the front gable.</text><rect x="570" y="284" width="16" height="16" fill="#cdb595"/><text x="598" y="298" font-family="Arial" font-size="18" font-weight="400" fill="#244b3b">Raised entry gable, level ridge</text><text x="598" y="326" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">It runs on over the covered porch, 1′0″ past the slab.</text><line x1="570" y1="364" x2="596" y2="364" stroke="#244b3b" stroke-width="2.6"/><text x="610" y="369" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Ridges</text><line x1="690" y1="364" x2="716" y2="364" stroke="#586a60" stroke-width="1.4"/><text x="730" y="369" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Hips, eaves and rakes</text><line x1="570" y1="398" x2="596" y2="398" stroke="#a8673d" stroke-width="2.2"/><text x="610" y="403" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Valleys</text><rect x="570" y="424" width="22" height="14" fill="#eef6f8" stroke="#5f8f96" stroke-width="1.2"/><text x="610" y="437" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Skylights: living room, kitchen, foyer (two), primary bathroom</text><line x1="570" y1="468" x2="596" y2="468" stroke="#7a857d" stroke-width="1" stroke-dasharray="5 4"/><text x="610" y="473" font-family="Arial" font-size="15" font-weight="400" fill="#2b3a33">Outside faces of the walls under the roof</text><text x="570" y="548" font-family="Arial" font-size="12" font-weight="400" fill="#6b665c">ROOF AS ON SHEETS A1.2, A1.3 AND SKA001 · NOT A FRAMING PLAN</text><text x="570" y="572" font-family="Arial" font-size="12" font-weight="400" fill="#6b665c">The entry roof's height follows from the site plan; framing, loads and drainage remain to be designed.</text></svg>
