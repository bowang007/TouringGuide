0.43 275.49" fill="none" stroke="#536c5e" stroke-width="1.4"/><text x="265.0" y="173.0" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#294c3d">MAIN HOUSE</text><text x="148.0" y="398.0" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#294c3d">BEDROOM 4</text><text x="148.0" y="515.0" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#294c3d">BEDROOM 3</text><text x="364.0" y="443.0" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#294c3d">GARAGE</text><text x="265" y="625" text-anchor="middle" font-family="Arial" font-size="12" fill="#596e60">FRONT / STREET</text><g font-family="Arial" fill="#315244"><text x="570" y="105" font-size="25">Existing forms guide the revision.</text><text x="570" y="140" font-size="15">Main hip and front garage gable follow the aerial photo.</text><text x="570" y="166" font-size="15">Their dimensions and 4:12 pitches remain provisional.</text><rect x="570" y="205" width="16" height="16" fill="#98b1a0"/><text x="598" y="219" font-size="18">One 6:12 gable over Bedrooms 3 and 4</text><text x="598" y="247" font-size="14">A small drainage cricket shapes the rear hip connection.</text><rect x="570" y="285" width="16" height="16" fill="#cbb696"/><text x="598" y="299" font-size="18">Lower entry gable</text><text x="598" y="327" font-size="14">A slight fall toward the front keeps the side valleys sloped.</text><path d="M570 370h24" stroke="#a8673d" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="375" font-size="15">Valley lines / direction of fall</text><path d="M570 408h24" stroke="#536c5e" stroke-width="2"/><text x="610" y="413" font-size="15">Ridges and hips</text><text x="570" y="470" font-size="14">Bedroom gable: solid wall above the retained bay canopy.</text><text x="570" y="496" font-size="14">Front walls: warm-white stucco with white trim.</text><text x="570" y="558" font-size="12" fill="#7b796b">PROPOSED ROOF GEOMETRY · NOT A SURVEY OR FRAMING PLAN</text><text x="570" y="581" font-size="12" fill="#7b796b">Field measurements and structural / drainage design are still required.</text></g></svg>